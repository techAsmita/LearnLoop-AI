<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>LearnLoop AI</title>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7f78ff"/>
      <stop offset="0.55" stop-color="#635bff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#glow)"/>

  <!-- learning loop: open ring with arrowhead -->
  <g transform="rotate(-50 32 32)">
    <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="5.5"
            stroke-linecap="round" stroke-dasharray="78 28.8"/>
  </g>
  <!-- arrowhead at the end of the arc, pointing along the loop -->
  <g transform="translate(20.3 18.6) rotate(-50)">
    <path d="M7 0 L-3.5 -6.5 L-3.5 6.5 Z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- AI spark at the centre -->
  <path d="M32 22 C32.8 28 34 29.2 40 30 C34 30.8 32.8 32 32 38 C31.2 32 30 30.8 24 30 C30 29.2 31.2 28 32 22 Z"
        transform="translate(0 2)" fill="#fff"/>
</svg>
